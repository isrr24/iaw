<VirtualHost *:80>
    ServerName default.local
     # 1. Su propio DocumentRoot
    DocumentRoot /var/www/default

    # 2. Su propio ErrorLog (donde se guardarán, por ejemplo, los errores 403)
    ErrorLog /var/log/apache2/default_error.log
    
    # 3. Su propio CustomLog (donde se guarda quién visita la web)
    CustomLog /var/log/apache2/default_access.log combined


    # Esto es lo que quita el error 403
    <Directory "/var/www/default">
        Require all granted
    </Directory>
</VirtualHost>

