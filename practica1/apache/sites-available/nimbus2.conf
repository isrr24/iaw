<VirtualHost *:80>
    ServerName nimbus2.local
    DocumentRoot /var/www/nimbus2

    # Configuración general de la carpeta de nimbus2
    <Directory /var/www/nimbus2>
        # Esto desactiva el listado de directorios (cumple el requisito de la práctica)
        Options -Indexes
        # Permitimos el acceso general a la web (para que funcione el index)
        Require all granted
    </Directory>

    # Protección exclusiva para el archivo sensible
    <Files "archivoprivado.php">
        Require all denied
    </Files>

</VirtualHost>
