<VirtualHost *:80>
    ServerName nimbus2.local
    
    # 1. Su propio DocumentRoot
    DocumentRoot /var/www/nimbus2

    # 2. Su propio ErrorLog (donde se guardarán, por ejemplo, los errores 403)
    ErrorLog /var/log/apache2/nimbus2_error.log
    
    # 3. Su propio CustomLog (donde se guarda quién visita la web)
    CustomLog /var/log/apache2/nimbus2_access.log combined

    # Configuración de la carpeta
    <Directory /var/www/nimbus2>
        Options -Indexes
        Require all granted
    </Directory>

    # Protección del archivo
    <Files "archivoprivado.php">
        Require all denied
    </Files>
</VirtualHost>
