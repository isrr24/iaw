<VirtualHost *:80>
    ServerName nimbus1.local
     # 1. Su propio DocumentRoot
    DocumentRoot /var/www/nimbus1

    # 2. Su propio ErrorLog (donde se guardarán, por ejemplo, los errores 403)
    ErrorLog /var/log/apache2/nimbus1_error.log
    
    # 3. Su propio CustomLog (donde se guarda quién visita la web)
    CustomLog /var/log/apache2/nimbus1_access.log combined


    # Esto es lo que quita el error 403
    <Directory "/var/www/nimbus1">
        Require all granted
    </Directory>
</VirtualHost>
