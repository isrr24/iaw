<VirtualHost *:80>
    ServerName default.local
    DocumentRoot "/usr/local/apache2/htdocs/nimbus1"

    # Esto es lo que quita el error 403
    <Directory "/usr/local/apache2/htdocs/nimbus1">
        Require all granted
    </Directory>
</VirtualHost>


<VirtualHost *:80>
    ServerName nimbus1.local
    DocumentRoot "/usr/local/apache2/htdocs/nimbus1"

    # Esto es lo que quita el error 403
    <Directory "/usr/local/apache2/htdocs/nimbus1">
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName nimbus2.local
    DocumentRoot "/usr/local/apache2/htdocs/nimbusdocs2"

    # --- TAREA 3: Desactivar listado de directorios ---
    <Directory "/usr/local/apache2/htdocs/nimbusdocs2">
        Options -Indexes 
        Require all granted
    </Directory>

    # --- TAREA 2: Proteger el archivo sensible simulado ---
    # (Sustituye "configuracion-privada.php" por el nombre que hayas elegido en la TAREA 1)
    <Files "configuracion-privada.php">
        Require all denied
    </Files>

</VirtualHost>
