version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: nimbusdocsp1
    ports:
      - "2001:80"
    restart: unless-stopped
    volumes:
      # Mapeo de las carpetas de tus webs a la ruta por defecto de Debian/Ubuntu
      - ./www:/var/www
      # Mapeo de la carpeta donde pondrás los VirtualHosts (.conf)
      - ./apache/sites-available:/etc/apache2/sites-available
      # Añade esta línea para mapear los logs:
      - ./apache/logs:/var/log/apache2
